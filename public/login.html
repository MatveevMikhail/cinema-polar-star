<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — кинотеатр «Полярная звезда»</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">★ Полярная звезда</a>
    <nav class="menu">
      <a href="index.html">Афиша</a>
      <a href="contacts.html">О кинотеатре</a>
      <span id="user-block"><a href="login.html">Войти</a></span>
    </nav>
  </header>

  <main class="container">
    <div class="forms">
      <!-- Форма входа -->
      <form id="login-form" class="form">
        <h2>Вход</h2>
        <label for="login-email">Email:</label>
        <input type="email" id="login-email" required>
        <label for="login-password">Пароль:</label>
        <input type="password" id="login-password" required>
        <button type="submit" class="btn">Войти</button>
        <p id="login-message" class="message"></p>
      </form>

      <!-- Форма регистрации -->
      <form id="register-form" class="form">
        <h2>Регистрация</h2>
        <label for="reg-name">Имя:</label>
        <input type="text" id="reg-name" required>
        <label for="reg-email">Email:</label>
        <input type="email" id="reg-email" required>
        <label for="reg-password">Пароль:</label>
        <input type="password" id="reg-password" required>
        <button type="submit" class="btn">Зарегистрироваться</button>
        <p id="reg-message" class="message"></p>
      </form>
    </div>
  </main>

  <footer class="footer">
    <p>Кинотеатр «Полярная звезда», г. Северодвинск · 2026</p>
    <p>Разработчик: Матвеев Михаил Андреевич</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
